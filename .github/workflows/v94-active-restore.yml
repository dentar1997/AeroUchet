name: Apply v94 active field and restore

on:
  push:
    branches:
      - ui/v94-active-field-restore
    paths:
      - .github/workflows/v94-active-restore.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v94-active-field-restore
      - name: Apply v94 patch
        run: python3 .github/scripts/v94_active_restore.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v94: active field shade and restore on extra backspace"
          git push origin ui/v94-active-field-restore

# rerun 2
