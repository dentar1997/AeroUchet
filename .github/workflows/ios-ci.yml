name: AeroUchet CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.memory/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write   # запасной снимок iPad публикуется в ветку ci-shots
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build for iOS Simulator (arm64)
        run: |
          set -o pipefail
          TIMELINE="$RUNNER_TEMP/aerouchet-build-timeline.jsonl"
          echo "{\"phase\":\"build.compile_started\",\"utc\":\"$(date -u +%FT%TZ)\"}" >> "$TIMELINE"
          # Раннер и iPad Simulator — Apple Silicon: x86_64 не нужен и удваивал компиляцию.
          # Ошибки компилятора выводим аннотациями: их видно в PR без скачивания логов.
          if ! xcodebuild \
            -scheme "АэроУчёт" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AeroUchetDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            -showBuildTimingSummary \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            grep -E "error: " "$RUNNER_TEMP/build.log" | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          echo "{\"phase\":\"build.compile_finished\",\"utc\":\"$(date -u +%FT%TZ)\"}" >> "$TIMELINE"
          # Итог по типам задач — аннотацией: её видно через API без скачивания логов.
          # Только диагностика: никакой вывод здесь не должен ронять сборку.
          set +e +o pipefail
          TIMING="$(awk '/Build Timing Summary/{f=1} f && /seconds/' "$RUNNER_TEMP/build.log" | head -8 | paste -sd ';' -)"
          WALL="$(grep -Eo 'BUILD SUCCEEDED.*' "$RUNNER_TEMP/build.log" | tail -1)"
          echo "::notice title=Build timing (arm64)::${WALL} ${TIMING}"
          exit 0

      - name: Package simulator app
        run: |
          PRODUCTS="$RUNNER_TEMP/AeroUchetDerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH="$(find "$PRODUCTS" -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            EXECUTABLE="$PRODUCTS/АэроУчёт"
            test -f "$EXECUTABLE"
            APP_PATH="$RUNNER_TEMP/АэроУчёт.app"
            mkdir -p "$APP_PATH"
            cp "$EXECUTABLE" "$APP_PATH/АэроУчёт"
            chmod +x "$APP_PATH/АэроУчёт"
            cat > "$APP_PATH/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>ru</string>
            <key>CFBundleDisplayName</key><string>АэроУчёт</string>
            <key>CFBundleExecutable</key><string>АэроУчёт</string>
            <key>CFBundleIdentifier</key><string>local.aerouchet.simulator</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>АэроУчёт</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>26.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          PLIST
            plutil -lint "$APP_PATH/Info.plist"
          fi
          echo "Simulator app: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/AeroUchet-Simulator.zip"
          echo "{\"phase\":\"build.package_ready\",\"utc\":\"$(date -u +%FT%TZ)\"}" >> "$RUNNER_TEMP/aerouchet-build-timeline.jsonl"

      # Публикуется сразу после сборки: iPad-раннер (параллельный job или тёплая
      # сессия) забирает .app ровно этого запуска, пока здесь идут тесты.
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AeroUchet-Simulator
          path: ${{ runner.temp }}/AeroUchet-Simulator.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core time regression checks
        run: |
          bash Scripts/run-core-time-tests.sh

      - name: Static analyze
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "АэроУчёт" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AeroUchetDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            analyze

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-timing-diagnostics
          path: |
            ${{ runner.temp }}/aerouchet-build-timeline.jsonl
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 7

      # Любой PR: снимок делает тёплый iPad (early-ipad-prewarm.yml, включается сам
      # от любой ветки). PR не зеленеет без проверенного снимка СВОЕГО SHA и СВОЕЙ
      # сборки. Если тёплой сессии нет — снимок делается здесь (холодно, ~10 мин).
      - name: iPad screenshot for this PR head (warm session or fallback)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/ipad-shot"
          # Снимок засчитывается, если он из ЭТОГО запуска CI или собран тёплой
          # сессией из ТОГО ЖЕ коммита ($GITHUB_SHA — тестовый merge PR).
          python3 Scripts/ci_ipad.py verify-shot \
            --sha "$PR_HEAD" --build-run-id "$GITHUB_RUN_ID" --built-commit "$GITHUB_SHA" \
            --dest "$OUT" --timeout 1200
          rc=$?
          if [ "$rc" -ne 3 ]; then exit "$rc"; fi
          echo "::warning::Тёплой сессии iPad нет — снимок делается здесь (холодный запуск, медленнее)"
          python3 -m pip install --quiet pillow 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || true
          STATE="$RUNNER_TEMP/ipad-state"
          python3 Scripts/ci_ipad.py prepare --state "$STATE" --visual
          python3 Scripts/ci_ipad.py capture --state "$STATE" \
            --zip "$RUNNER_TEMP/AeroUchet-Simulator.zip" --out "$OUT" \
            --shots-file .github/prewarm/shots.json \
            --mode fallback --pr-sha "$PR_HEAD" --pr-number "$PR_NUMBER" \
            --head-ref "$HEAD_REF" --build-run-id "$GITHUB_RUN_ID"
          rc=$?
          python3 Scripts/ci_ipad.py publish --out "$OUT" --sha "$PR_HEAD" --label "fallback PR #$PR_NUMBER"
          exit "$rc"

      - name: Summarize iPad screenshot
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          python3 Scripts/ci_ipad.py summarize --out "$RUNNER_TEMP/ipad-shot" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload iPad screenshot
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ipad-shot
          path: ${{ runner.temp }}/ipad-shot/
          if-no-files-found: warn
          retention-days: 7

  # Метод А — только для ручного запуска CI (без PR тёплый iPad не работает):
  # независимый macOS-раннер загружает iPad параллельно со сборкой.
  # Для PR с 13.10 его заменяет тёплый iPad (DECISIONS U55).
  simulator-smoke:
    if: ${{ github.event_name != 'pull_request' }}
    name: iPad Simulator smoke (parallel build + boot)
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write   # снимок публикуется в ветку ci-shots
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pillow for the layout check (optional)
        run: |
          python3 -m pip install --quiet pillow 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || echo 'no Pillow, layout check skipped'

      - name: Boot 12.9-inch iPad now (dark + rotation while the app compiles)
        run: |
          STATE="$RUNNER_TEMP/ipad-state"
          mkdir -p "$STATE"
          RUNNER_TRACKING_ID="" nohup python3 Scripts/ci_ipad.py prepare --state "$STATE" --visual \
            > "$STATE/prepare.log" 2>&1 < /dev/null &
          echo "Simulator boot started concurrently with the independent build job"

      - name: Wait for this run's compiled app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/ci_ipad.py wait-artifact --run-id "$GITHUB_RUN_ID" \
            --dest "$RUNNER_TEMP/ipad-app" --timeout 900

      - name: Capture main and aircraft/Tamm screenshots
        id: smoke
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 Scripts/ci_ipad.py capture --state "$RUNNER_TEMP/ipad-state" \
            --zip "$RUNNER_TEMP/ipad-app/AeroUchet-Simulator.zip" --out "$RUNNER_TEMP/ipad-shot" \
            --shots main-screen,aircraft-tamm --mode A --install-early \
            --pr-sha "$PR_HEAD" --pr-number "$PR_NUMBER" --build-run-id "$GITHUB_RUN_ID"

      - name: Publish screenshots for assistants (ci-shots branch)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "$RUNNER_TEMP/ipad-shot/proof.json" ]; then
            python3 Scripts/ci_ipad.py publish --out "$RUNNER_TEMP/ipad-shot" --sha "$PR_HEAD" --label "A PR #$PR_NUMBER"
          fi

      - name: Summarize screenshots and wall time
        if: always()
        run: |
          echo "Screenshot step: ${{ steps.smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          python3 Scripts/ci_ipad.py summarize --out "$RUNNER_TEMP/ipad-shot" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-diagnostics
          path: |
            ${{ runner.temp }}/ipad-shot/
            ${{ runner.temp }}/ipad-state/
            !${{ runner.temp }}/**/*.zip
          if-no-files-found: warn
          retention-days: 7
