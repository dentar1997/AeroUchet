name: AeroUchet CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Show package schemes
        run: |
          xcodebuild -list || true

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "АэроУчёт" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AeroUchetDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildTimingSummary \
            build

      - name: Package simulator app
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/AeroUchetDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Simulator app: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/AeroUchet-Simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AeroUchet-Simulator
          path: ${{ runner.temp }}/AeroUchet-Simulator.zip
          if-no-files-found: error
          retention-days: 7
