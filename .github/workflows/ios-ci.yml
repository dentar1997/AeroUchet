name: AeroUchet CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Show package schemes
        run: |
          xcodebuild -list || true

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "АэроУчёт" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Static analyze
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "АэроУчёт" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            analyze
