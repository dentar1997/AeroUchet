name: AeroUchet CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.memory/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Show package schemes
        run: |
          xcodebuild -list || true

      - name: Core time regression checks
        run: |
          bash Scripts/run-core-time-tests.sh

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          # Ошибки компилятора выводим аннотациями: их видно в PR без скачивания логов.
          if ! xcodebuild \
            -scheme "АэроУчёт" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AeroUchetDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildTimingSummary \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            grep -E "error: " "$RUNNER_TEMP/build.log" | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Static analyze
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "АэроУчёт" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AeroUchetDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Package simulator app
        run: |
          PRODUCTS="$RUNNER_TEMP/AeroUchetDerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH="$(find "$PRODUCTS" -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            EXECUTABLE="$PRODUCTS/АэроУчёт"
            test -f "$EXECUTABLE"
            APP_PATH="$RUNNER_TEMP/АэроУчёт.app"
            mkdir -p "$APP_PATH"
            cp "$EXECUTABLE" "$APP_PATH/АэроУчёт"
            chmod +x "$APP_PATH/АэроУчёт"
            cat > "$APP_PATH/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>ru</string>
            <key>CFBundleDisplayName</key><string>АэроУчёт</string>
            <key>CFBundleExecutable</key><string>АэроУчёт</string>
            <key>CFBundleIdentifier</key><string>local.aerouchet.simulator</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>АэроУчёт</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>26.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          PLIST
            plutil -lint "$APP_PATH/Info.plist"
          fi
          echo "Simulator app: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/AeroUchet-Simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AeroUchet-Simulator
          path: ${{ runner.temp }}/AeroUchet-Simulator.zip
          if-no-files-found: error
          retention-days: 7

  # Independent macOS runner: iPadOS boot starts at the same time as the
  # build on a separate runner, so neither competes for the other's CPU.
  # Only download an artifact from this *same* workflow run after it exists.
  simulator-smoke:
    name: iPad Simulator smoke (parallel build + boot)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prewarm 12.9-inch iPad immediately
        run: |
          mkdir -p "$RUNNER_TEMP/aerouchet-smoke-results"
          date +%s > "$RUNNER_TEMP/aerouchet-smoke-results/ci-start-epoch.txt"
          RUNNER_TRACKING_ID="" nohup bash Scripts/ci-simulator-smoke.sh \
            --preboot "$RUNNER_TEMP/aerouchet-smoke-results" \
            > "$RUNNER_TEMP/aerouchet-preboot-launch.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/aerouchet-preboot.pid"
          echo "Simulator boot started concurrently with the independent build job"

      - name: Wait for this run's compiled app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEST="$RUNNER_TEMP/aerouchet-simulator-bundle"
          mkdir -p "$DEST"
          for attempt in $(seq 1 90); do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name AeroUchet-Simulator \
                --dir "$DEST" \
                > "$RUNNER_TEMP/aerouchet-download.log" 2>&1; then
              echo "Downloaded the compiled app from run $GITHUB_RUN_ID"
              break
            fi
            # A failed build cannot produce the correct artifact. Fail quickly
            # instead of waiting for an unrelated/older run to finish.
            BUILD_RESULT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Build iOS app") | .conclusion // empty' 2>/dev/null || true)"
            if printf '%s' "$BUILD_RESULT" | grep -Eq 'failure|cancelled|timed_out'; then
              echo "Build job failed; no screenshot can be taken"
              exit 1
            fi
            echo "Waiting for app artifact (attempt $attempt)"
            sleep 10
          done
          if [ ! -f "$DEST/AeroUchet-Simulator.zip" ]; then
            echo "No app archive for this workflow run"
            cat "$RUNNER_TEMP/aerouchet-download.log"
            exit 1
          fi

      - name: Capture main and aircraft/Tamm screenshots
        id: smoke
        continue-on-error: true
        run: |
          bash Scripts/ci-simulator-smoke.sh \
            "$RUNNER_TEMP/aerouchet-simulator-bundle/AeroUchet-Simulator.zip" \
            "$RUNNER_TEMP/aerouchet-smoke-results"

      - name: Summarize screenshots and wall time
        if: always()
        run: |
          echo '### iPad Pro 12.9 (landscape/dark; parallel CI runners)' >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshot step: ${{ steps.smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/aerouchet-smoke-results/status.txt" ]; then
            echo "Smoke status: $(cat "$RUNNER_TEMP/aerouchet-smoke-results/status.txt")" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/aerouchet-smoke-results/preboot.status" ]; then
            echo "Preboot: $(cat "$RUNNER_TEMP/aerouchet-smoke-results/preboot.status")" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/aerouchet-smoke-results/ci-start-epoch.txt" ]; then
            START="$(cat "$RUNNER_TEMP/aerouchet-smoke-results/ci-start-epoch.txt")"
            echo "Elapsed since preboot: $(($(date +%s) - START)) seconds" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Images: main-screen.png, aircraft-tamm.png and aircraft-tamm-preview.jpg' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-diagnostics
          path: ${{ runner.temp }}/aerouchet-smoke-results/
          if-no-files-found: warn
          retention-days: 7
