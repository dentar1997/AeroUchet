name: Apply v100 patch

on:
  push:
    branches:
      - ui/v100-compact-editor-reset
    paths:
      - .github/scripts/v100_patch.py
      - .github/workflows/v100-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v100-compact-editor-reset
      - name: Apply patch
        run: python3 .github/scripts/v100_patch.py
      - name: Commit app changes
        run: |
          git config user.name dentar1997
          git config user.email dentar1997@gmail.com
          git add AppViews.swift AppVersion.swift Package.swift
          if git diff --cached --quiet; then
            echo "No app changes"
            exit 0
          fi
          git commit -m "v100: compact editors and restore semantics"
          git push
