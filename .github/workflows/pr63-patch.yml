name: PR63 Patch

on:
  push:
    branches:
      - ui/pr63-tight-inline-selection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr63-tight-inline-selection
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/pr63_patch.py

      - name: Remove temporary patch files
        run: |
          rm .github/pr63_patch.py
          rm .github/workflows/pr63-patch.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR #63] Tighten inline selection highlight"
          git push origin HEAD:ui/pr63-tight-inline-selection
