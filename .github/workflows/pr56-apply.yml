name: Apply PR56 UI patch

on:
  push:
    branches:
      - ui/pr56-stable-inline-calendar-layering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr56-stable-inline-calendar-layering
          fetch-depth: 0
      - name: Patch AppViews
        run: python3 .github/pr56_patch.py
      - name: Remove temporary patch files
        run: rm .github/pr56_patch.py .github/workflows/pr56-apply.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift .github/pr56_patch.py .github/workflows/pr56-apply.yml
          git commit -m "[PR #56] Stabilize inline fields and calendar layering"
          git push origin HEAD:ui/pr56-stable-inline-calendar-layering
