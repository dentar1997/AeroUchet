name: Apply v81 hardware keyboard

on:
  push:
    branches:
      - ui/v81-hardware-keyboard
    paths:
      - .github/workflows/v81-hardware-keyboard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v81-hardware-keyboard

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v81_patch.py
          python3 /tmp/v81_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v81: restore native hardware keyboard input"
          git push
