name: Temporary schedule calendar patch

on:
  push:
    branches:
      - fix/schedule-execution-calendar-v133

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-execution-calendar-v133
      - name: Patch schedule execution calendar
        shell: bash
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ReferenceDataV129.swift .github/workflows/temp-patch-schedule-calendar.yml
          git commit -m "Fix schedule execution calendar"
          git push origin HEAD:fix/schedule-execution-calendar-v133
