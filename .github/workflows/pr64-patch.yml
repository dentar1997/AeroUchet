name: PR64 Patch

on:
  push:
    branches:
      - ui/pr64-route-and-hardware-keyboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr64-route-and-hardware-keyboard
      - name: Apply patch
        run: python .github/pr64_patch.py
      - name: Remove temporary patch files
        run: rm -f .github/pr64_patch.py .github/workflows/pr64-patch.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[PR #64] Split route editing and restore hardware keyboard'
          git push origin HEAD:ui/pr64-route-and-hardware-keyboard
