name: PR64 Patch

on:
  push:
    branches:
      - ui/pr64-inline-assignment-route-keyboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr64-inline-assignment-route-keyboard
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/pr64_patch.py
      - name: Remove temporary patch files
        run: rm -f .github/scripts/pr64_patch.py .github/workflows/pr64-patch.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR #64] Inline assignment and route editing with hardware keyboard"
          git push
