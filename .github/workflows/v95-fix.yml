name: Finalize v95

on:
  push:
    branches:
      - ui/v95-edit-state-polish

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v95-edit-state-polish
          fetch-depth: 0

      - name: Finalize flight editor
        run: python3 Scripts/v95_finalize.py

      - name: Commit v95 final state
        run: |
          rm -f .github/workflows/v95-fix.yml Scripts/v95_finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v95: finalize edit state polish"
          git push origin HEAD:ui/v95-edit-state-polish
