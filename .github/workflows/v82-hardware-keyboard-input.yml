name: Apply v82 keyboard input

on:
  push:
    branches:
      - ui/v82-hardware-keyboard-input
    paths:
      - .github/workflows/v82-hardware-keyboard-input.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v82-hardware-keyboard-input

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v82_patch.py
          python3 /tmp/v82_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v82: route keyboard text through UIKeyInput"
          git push
