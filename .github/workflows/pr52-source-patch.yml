name: Apply PR52 source patch

on:
  push:
    branches:
      - ui/pr52-fix-calculated-toggle-popover-scroll

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr52-fix-calculated-toggle-popover-scroll
          fetch-depth: 0

      - name: Apply source changes
        run: python3 pr52_patch.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR52 patched] Fix edit popovers and assignment scrolling"
          git push
