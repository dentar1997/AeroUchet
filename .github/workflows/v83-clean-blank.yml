name: Clean v83 formatting

on:
  push:
    branches:
      - ui/v83-balanced-header-layout
    paths:
      - .github/workflows/v83-clean-blank.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v83-balanced-header-layout
      - name: Remove extra blank line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AppViews.swift')
          s = p.read_text()
          old = '        }\n    }\n\n\n    private func flightNumber'
          new = '        }\n    }\n\n    private func flightNumber'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift
          git commit -m "chore: clean v83 formatting"
          git push origin ui/v83-balanced-header-layout
