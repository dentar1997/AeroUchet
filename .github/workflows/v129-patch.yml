name: v129 patch

on:
  push:
    branches:
      - chatgpt/v129-schedule-aircraft

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v129-schedule-aircraft
          fetch-depth: 0

      - name: Apply v129 source changes
        run: python3 scripts/v129_patch.py

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-v129"
          git config user.email "actions@users.noreply.github.com"
          git add AssignmentsSettings.swift PlanAssignmentRowV119.swift PerspectivePlanV119.swift AssignmentsView.swift AppViews.swift
          git commit -m "v129: подключить справочники к заданиям и перспективному плану"
          git push origin HEAD:chatgpt/v129-schedule-aircraft
