name: Apply PR57 UI patch

on:
  push:
    branches:
      - ui/pr57-stable-card-sizing-time-overlay

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr57-stable-card-sizing-time-overlay
          fetch-depth: 0

      - name: Patch AppViews
        run: python3 .pr57_patch.py

      - name: Remove temporary patch files
        run: rm .pr57_patch.py .github/workflows/pr57-apply.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift .pr57_patch.py .github/workflows/pr57-apply.yml
          git commit -m "[PR #57] Stabilize edit card sizing and time editor layering"
          git push origin HEAD:ui/pr57-stable-card-sizing-time-overlay
