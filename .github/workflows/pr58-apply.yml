name: Apply PR58 version and assignment fixes

on:
  push:
    branches:
      - ui/pr58-version-and-assignment-font

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr58-version-and-assignment-font
          fetch-depth: 0

      - name: Patch AppViews
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('AppViews.swift')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''                ) {
                    
                    Text(
                        monthTitle(
''',
              '''                ) {
                    
                    HStack {
                        Text(AppVersion.label)
                            .font(.caption.weight(.semibold))
                            .foregroundStyle(.secondary)

                        Spacer()
                    }
                    
                    Text(
                        monthTitle(
''',
              'home version label'
          )

          replace_once(
              '''                    if focusedField == .assignment {
                        InlineSelectAllTextField(
                            text: $assignmentNumber,
                            isActive: focusBinding(.assignment),
                            keyboardType: .numberPad,
                            capitalization: .none,
                            textAlignment: .center,
                            font: .boldSystemFont(ofSize: 22)
                        )
                        .frame(width: 112, height: 30)
                    } else {
                        Text(assignmentNumber.isEmpty ? "—" : assignmentNumber)
                    }
''',
              '''                    InlineSelectAllTextField(
                        text: $assignmentNumber,
                        isActive: focusBinding(.assignment),
                        keyboardType: .numberPad,
                        capitalization: .none,
                        textAlignment: .center,
                        font: .boldSystemFont(ofSize: 22)
                    )
                    .frame(width: 112, height: 30)
''',
              'stable assignment number field'
          )

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/pr58-apply.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift .github/workflows/pr58-apply.yml
          git commit -m "[PR #58] Show version and stabilize assignment number font"
          git push origin HEAD:ui/pr58-version-and-assignment-font
