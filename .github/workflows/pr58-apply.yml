name: Apply PR58 source patch

on:
  push:
    branches:
      - ui/pr58-version-and-assignment-font

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr58-version-and-assignment-font
          fetch-depth: 0
      - name: Patch AppViews
        run: python3 Scripts/pr58_patch.py
      - name: Remove temporary patch files
        run: rm Scripts/pr58_patch.py .github/workflows/pr58-apply.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift Scripts/pr58_patch.py .github/workflows/pr58-apply.yml
          git commit -m "[PR #58] Show version and stabilize assignment number font"
          git push origin HEAD:ui/pr58-version-and-assignment-font
