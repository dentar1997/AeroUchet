name: Apply v95 return fix

on:
  push:
    branches:
      - ui/v95-edit-state-polish

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v95-edit-state-polish
          fetch-depth: 0

      - name: Add explicit return
        run: python3 Scripts/v95_return_fix.py

      - name: Commit final v95 fix
        run: |
          rm -f .github/workflows/v95-return-fix.yml Scripts/v95_return_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v95: return stable editor view"
          git push origin HEAD:ui/v95-edit-state-polish
