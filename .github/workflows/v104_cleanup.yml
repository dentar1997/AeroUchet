name: v104 Test 3 cleanup
on:
  push:
    branches:
      - ui/v104-full-test3-editor
    paths:
      - .github/v104_cleanup.py
      - .github/workflows/v104_cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v104-full-test3-editor
      - run: python3 .github/v104_cleanup.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add InlineWheelTestView.swift
          git commit -m "Убрать дублирующий Test 3 [v104-clean]" || exit 0
          git push
