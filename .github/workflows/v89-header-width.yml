name: Apply v89 header and width

on:
  push:
    branches:
      - ui/v89-header-toolbar-and-width
    paths:
      - .github/workflows/v89-header-width.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v89-header-toolbar-and-width

      - name: Apply v89 patch
        run: python3 .github/scripts/v89_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v89: compact leg width and rebalance header"
          git push origin ui/v89-header-toolbar-and-width
