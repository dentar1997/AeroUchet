name: Apply version 113 patch

on:
  push:
    branches:
      - feature/duty-editor-v113

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/duty-editor-v113

      - name: Apply patch
        run: python3 Scripts/apply-v113.py

      - name: Validate patch
        run: git diff --check

      - name: Commit patch and remove temporary helpers
        run: |
          git rm .github/workflows/apply-v113.yml Scripts/apply-v113.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AppViews.swift AppVersion.swift
          git commit -m 'Версия 113: расчётное время и подтверждение удаления'
          git push origin HEAD:feature/duty-editor-v113
