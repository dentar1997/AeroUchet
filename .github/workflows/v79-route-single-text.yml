name: Apply v79 route single text

on:
  push:
    branches:
      - ui/v79-stable-edit-layout
    paths:
      - .github/workflows/v79-route-single-text.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v79-stable-edit-layout

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v79_route.py
          python3 /tmp/v79_route.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift
          git commit -m "v79: keep route as one text layout"
          git push
