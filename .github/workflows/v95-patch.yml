name: Apply v95 editing polish

on:
  push:
    branches: ["ui/v95-edit-state-polish"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v95-edit-state-polish
          fetch-depth: 0

      - name: Apply v95 patch
        run: python3 Scripts/v95_patch.py

      - name: Commit v95
        run: |
          rm -f .github/workflows/v95-patch.yml Scripts/v95_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v95: polish editing state"
          git push origin HEAD:ui/v95-edit-state-polish
