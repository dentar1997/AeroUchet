name: PR67 Patch

on:
  push:
    branches:
      - ui/pr67-route-limits-layout-keyboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr67-route-limits-layout-keyboard
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/pr67_patch.py
      - name: Remove temporary patch files
        run: |
          rm -f tools/pr67_patch.py
          rm -f .github/workflows/pr67-patch.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[PR #67] Route spacing, limits, compact header fields, keyboard'
          git push origin HEAD:ui/pr67-route-limits-layout-keyboard
