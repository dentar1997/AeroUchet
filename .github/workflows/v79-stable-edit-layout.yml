name: Apply v79 assignment tap fix

on:
  push:
    branches:
      - ui/v79-stable-edit-layout
    paths:
      - .github/workflows/v79-stable-edit-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v79-stable-edit-layout

      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AppViews.swift')
          text = path.read_text()
          old = '''                .frame(maxWidth: .infinity, minHeight: lineHeight, maxHeight: lineHeight)
                .allowsHitTesting(false)
'''
          new = '''                .frame(maxWidth: .infinity, minHeight: lineHeight, maxHeight: lineHeight)
'''
          if old not in text:
              raise SystemExit('stable editor hit testing block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift
          git commit -m "v79: keep assignment editor tappable"
          git push
