name: Apply v79 stable edit layout

on:
  push:
    branches:
      - ui/v79-stable-edit-layout
    paths:
      - .github/workflows/v79-stable-edit-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v79-stable-edit-layout

      - name: Apply patch
        run: |
          echo 'REPLACE_BASE64' | base64 --decode > /tmp/v79_patch.py
          python3 /tmp/v79_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v79: keep duty text layout stable while editing"
          git push
