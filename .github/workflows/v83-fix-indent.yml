name: Fix v83 indentation

on:
  push:
    branches:
      - ui/v83-balanced-header-layout
    paths:
      - .github/workflows/v83-fix-indent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v83-balanced-header-layout

      - name: Fix indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AppViews.swift")
          s = p.read_text()
          start = s.index("    private func legHeader(_ leg: FlightLeg, index: Int) -> some View {")
          end = s.index("private func flightNumber", start)
          chunk = s[start:end]
          lines = chunk.splitlines()
          fixed = [lines[0]] + [("    " + line if line else "") for line in lines[1:]]
          s = s[:start] + "\n".join(fixed) + "\n\n    " + s[end:]
          p.write_text(s)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift
          git commit -m "chore: fix v83 indentation"
          git push origin ui/v83-balanced-header-layout
