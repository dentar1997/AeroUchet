name: Apply v99 patch

on:
  push:
    branches:
      - ui/v99-compact-time-editor
    paths:
      - .github/scripts/v99_patch.py
      - .github/workflows/v99-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v99-compact-time-editor
      - name: Apply patch
        run: python3 .github/scripts/v99_patch.py
      - name: Commit app changes
        run: |
          git config user.name dentar1997
          git config user.email dentar1997@gmail.com
          git add AppViews.swift
          if git diff --cached --quiet; then
            echo "No app changes"
            exit 0
          fi
          git commit -m "v99: compact date and time editor"
          git push
