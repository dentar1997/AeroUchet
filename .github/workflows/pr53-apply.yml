name: Apply PR53 editor layout patch

on:
  push:
    branches:
      - ui/pr53-editor-card-layout-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr53-editor-card-layout-fixes
          fetch-depth: 0

      - name: Apply source patch
        run: python3 pr53_patch.py

      - name: Remove temporary patch files
        run: rm -f pr53_patch.py .github/workflows/pr53-apply.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR53 patched] Use compact custom editor cards"
          git push
