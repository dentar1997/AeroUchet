name: Apply PR51 source patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ui/pr51-calculated-time-and-popovers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # ---- AeroCore.swift ----
          core_path = Path('AeroCore.swift')
          core = core_path.read_text()

          core = replace_one(
              core,
              '    var scheduleType: FlightScheduleType?\n',
              '    var scheduleType: FlightScheduleType?\n    var calculatedMinutesOverride: Int?\n',
              'FlightLeg property'
          )

          core = replace_one(
              core,
              '        scheduleType: FlightScheduleType? = nil\n    ) {',
              '        scheduleType: FlightScheduleType? = nil,\n        calculatedMinutesOverride: Int? = nil\n    ) {',
              'FlightLeg init parameter'
          )

          core = replace_one(
              core,
              '        self.scheduleType = scheduleType\n',
              '        self.scheduleType = scheduleType\n        self.calculatedMinutesOverride = calculatedMinutesOverride\n',
              'FlightLeg init assignment'
          )

          core = replace_one(
              core,
              '''    var calculatedMinutes: Int? {\n        if scheduleType == .unscheduled { return flightMinutes }\n        return nil\n    }''',
              '''    var calculatedMinutes: Int? {\n        if let calculatedMinutesOverride {\n            return max(0, calculatedMinutesOverride)\n        }\n        if scheduleType == .unscheduled { return flightMinutes }\n        return nil\n    }''',
              'calculatedMinutes'
          )

          core_path.write_text(core)

          # ---- AppViews.swift ----
          app_path = Path('AppViews.swift')
          app = app_path.read_text()

          app = replace_one(
              app,
              '    case registration(Int)\n    case time(Int, DutyEditPoint)\n',
              '    case registration(Int)\n    case calculatedTime(Int)\n    case time(Int, DutyEditPoint)\n',
              'DutyFocusedField'
          )

          app = replace_one(
              app,
              '''            add("Тип рейса", (old.scheduleType ?? .planned).rawValue,\n                (new.scheduleType ?? .planned).rawValue)\n\n            let oldTimes = times(for: old)''',
              '''            add("Тип рейса", (old.scheduleType ?? .planned).rawValue,\n                (new.scheduleType ?? .planned).rawValue)\n            add(\n                "Расчётное время",\n                old.calculatedMinutesOverride.map(timeText) ?? "Из таблицы",\n                new.calculatedMinutesOverride.map(timeText) ?? "Из таблицы"\n            )\n\n            let oldTimes = times(for: old)''',
              'differences calculated time'
          )

          app = app.replace('calculatedTime(leg)', 'calculatedTime(leg, index: index)')

          app = replace_one(
              app,
              '''                        .padding(8)\n                        .frame(width: 200)\n                        .environment(\\.locale, Locale(identifier: "ru_RU"))''',
              '''                        .padding(.horizontal, 18)\n                        .padding(.vertical, 10)\n                        .frame(width: 230)\n                        .presentationCornerRadius(10)\n                        .environment(\\.locale, Locale(identifier: "ru_RU"))''',
              'assignment popover padding'
          )

          app = replace_one(
              app,
              '''                    .padding(10)\n                    .frame(width: editPopoverWidth(for: field))\n                    .environment(\\.locale, Locale(identifier: "ru_RU"))''',
              '''                    .padding(.horizontal, 18)\n                    .padding(.vertical, 10)\n                    .frame(width: editPopoverWidth(for: field))\n                    .presentationCornerRadius(10)\n                    .environment(\\.locale, Locale(identifier: "ru_RU"))''',
              'generic popover padding'
          )

          width_pattern = re.compile(r'''    private func editPopoverWidth\(for field: DutyFocusedField\) -> CGFloat \{\n        switch field \{\n        case \.legNumber:\n            return 180\n        case \.aircraft:\n            return 190\n        case \.registration:\n            return 205\n        case \.flightKind:\n            return 205\n        case \.route:\n            return 315\n        default:\n            return 230\n        \}\n    \}''')
          width_repl = '''    private func editPopoverWidth(for field: DutyFocusedField) -> CGFloat {\n        switch field {\n        case .legNumber:\n            return 220\n        case .aircraft:\n            return 225\n        case .registration:\n            return 245\n        case .flightKind:\n            return 245\n        case .route:\n            return 350\n        case .calculatedTime:\n            return 245\n        default:\n            return 260\n        }\n    }'''
          app, count = width_pattern.subn(width_repl, app, count=1)
          if count != 1:
              raise SystemExit(f'editPopoverWidth: expected 1 match, got {count}')

          old_calc = '''    private func calculatedTime(_ leg: FlightLeg) -> some View {\n        legValueCard(\n            title: "Расчётное время",\n            value: leg.calculatedMinutes.map(timeText) ?? "Ожидает норму"\n        )\n    }\n'''
          new_calc = '''    private func calculatedTime(_ leg: FlightLeg, index: Int) -> some View {\n        Group {\n            if isEditing {\n                Button {\n                    focusedField = .calculatedTime(index)\n                } label: {\n                    legValueCard(\n                        title: "Расчётное время",\n                        value: leg.calculatedMinutes.map(timeText) ?? "Ожидает норму"\n                    )\n                    .overlay(\n                        RoundedRectangle(cornerRadius: 10)\n                            .stroke(Color.accentColor.opacity(0.65), lineWidth: 1)\n                    )\n                }\n                .buttonStyle(.plain)\n                .popover(isPresented: focusBinding(.calculatedTime(index))) {\n                    VStack(alignment: .leading, spacing: 8) {\n                        editPopoverHeader(\n                            "Расчётное время",\n                            extraHorizontalInset: 0\n                        )\n\n                        Button {\n                            toggleCalculatedTimeSource(index)\n                        } label: {\n                            HStack(spacing: 7) {\n                                Image(\n                                    systemName: draft[index].calculatedMinutesOverride == nil\n                                    ? "checkmark.square.fill"\n                                    : "square"\n                                )\n                                Text("Из таблицы")\n                            }\n                            .frame(maxWidth: .infinity, alignment: .leading)\n                        }\n                        .buttonStyle(.plain)\n\n                        if draft[index].calculatedMinutesOverride != nil {\n                            DatePicker(\n                                "",\n                                selection: calculatedTimeBinding(index),\n                                displayedComponents: [.hourAndMinute]\n                            )\n                            .labelsHidden()\n                            .datePickerStyle(.wheel)\n                            .frame(width: 150, height: 130)\n                            .clipped()\n                            .frame(maxWidth: .infinity, alignment: .leading)\n                        } else {\n                            Text(\n                                draft[index].calculatedMinutes.map(timeText)\n                                ?? "Ожидает норму"\n                            )\n                            .font(.subheadline.weight(.semibold))\n                            .foregroundStyle(.secondary)\n                        }\n                    }\n                    .padding(.horizontal, 18)\n                    .padding(.vertical, 10)\n                    .frame(width: 245)\n                    .presentationCornerRadius(10)\n                    .environment(\\.locale, Locale(identifier: "ru_RU"))\n                    .environment(\\.timeZone, moscowTimeZone)\n                }\n            } else {\n                legValueCard(\n                    title: "Расчётное время",\n                    value: leg.calculatedMinutes.map(timeText) ?? "Ожидает норму"\n                )\n            }\n        }\n    }\n\n    private func toggleCalculatedTimeSource(_ index: Int) {\n        if draft[index].calculatedMinutesOverride == nil {\n            let seed = draft[index].calculatedMinutes ?? draft[index].flightMinutes\n            draft[index].calculatedMinutesOverride = max(0, seed)\n        } else {\n            draft[index].calculatedMinutesOverride = nil\n        }\n    }\n\n    private func calculatedTimeBinding(_ index: Int) -> Binding<Date> {\n        let base = moscowCalendar.date(\n            from: DateComponents(year: 2001, month: 1, day: 1)\n        )!\n\n        return Binding(\n            get: {\n                moscowCalendar.date(\n                    byAdding: .minute,\n                    value: draft[index].calculatedMinutesOverride\n                        ?? draft[index].flightMinutes,\n                    to: base\n                )!\n            },\n            set: { newDate in\n                let components = moscowCalendar.dateComponents(\n                    [.hour, .minute],\n                    from: newDate\n                )\n                let hours = components.hour ?? 0\n                let minutes = components.minute ?? 0\n                draft[index].calculatedMinutesOverride = hours * 60 + minutes\n            }\n        )\n    }\n'''
          app = replace_one(app, old_calc, new_calc, 'calculatedTime editor')

          old_calendar = '''                        HStack(alignment: .top, spacing: -28) {\n                            DatePicker(\n                                "",\n                                selection: timeBinding(index, point),\n                                displayedComponents: [.date]\n                            )\n                            .labelsHidden()\n                            .datePickerStyle(.graphical)\n                            .scaleEffect(0.72, anchor: .topLeading)\n                            .frame(\n                                width: 218,\n                                height: 178,\n                                alignment: .topLeading\n                            )\n                            .clipped()\n\n                            DatePicker(\n                                "",\n                                selection: timeBinding(index, point),\n                                displayedComponents: [.hourAndMinute]\n                            )\n                            .labelsHidden()\n                            .datePickerStyle(.wheel)\n                            .scaleEffect(0.82)\n                            .frame(\n                                width: 120,\n                                height: 178\n                            )\n                            .clipped()\n                            .offset(x: -10)\n                        }'''
          new_calendar = '''                        HStack(alignment: .top, spacing: -28) {\n                            ZStack(alignment: .topLeading) {\n                                DatePicker(\n                                    "",\n                                    selection: timeBinding(index, point),\n                                    displayedComponents: [.date]\n                                )\n                                .labelsHidden()\n                                .datePickerStyle(.graphical)\n                                .frame(width: 302, height: 246, alignment: .topLeading)\n                                .transaction { transaction in\n                                    transaction.animation = nil\n                                }\n                                .scaleEffect(0.72, anchor: .topLeading)\n                            }\n                            .frame(\n                                width: 218,\n                                height: 178,\n                                alignment: .topLeading\n                            )\n                            .clipped()\n\n                            DatePicker(\n                                "",\n                                selection: timeBinding(index, point),\n                                displayedComponents: [.hourAndMinute]\n                            )\n                            .labelsHidden()\n                            .datePickerStyle(.wheel)\n                            .scaleEffect(0.82)\n                            .frame(\n                                width: 120,\n                                height: 178\n                            )\n                            .clipped()\n                            .offset(x: -10)\n                        }'''
          app = replace_one(app, old_calendar, new_calendar, 'stable graphical calendar')

          app = replace_one(
              app,
              '''                    .frame(width: 365)\n                    .fixedSize(horizontal: false, vertical: true)\n                    .environment(\\.locale, Locale(identifier: "ru_RU"))''',
              '''                    .frame(width: 365)\n                    .fixedSize(horizontal: false, vertical: true)\n                    .presentationCornerRadius(10)\n                    .environment(\\.locale, Locale(identifier: "ru_RU"))''',
              'time popover corner radius'
          )

          app_path.write_text(app)
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr51-apply.yml
          git add AeroCore.swift AppViews.swift
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[PR #51] Редактирование расчётного времени и стабильные поповеры"
          git push origin HEAD:${{ github.head_ref }}
