name: Apply v80 accent selection

on:
  push:
    branches:
      - ui/v80-accent-selection
    paths:
      - .github/workflows/v80-accent-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v80-accent-selection

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v80_patch.py
          python3 /tmp/v80_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v80: use accent text for active inline fields"
          git push
