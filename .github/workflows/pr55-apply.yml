name: Apply PR55 inline editing patch

on:
  push:
    branches:
      - ui/pr55-inline-card-editing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr55-inline-card-editing
          fetch-depth: 0

      - name: Apply source patch
        run: python3 pr55_patch.py

      - name: Remove temporary patch files
        run: rm -f pr55_patch.py .github/workflows/pr55-apply.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR55 patched] Inline card editing and editor layering"
          git push origin HEAD:ui/pr55-inline-card-editing
