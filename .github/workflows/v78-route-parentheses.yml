name: Apply v78 route parentheses fix

on:
  push:
    branches:
      - ui/v78-route-parentheses
    paths:
      - .github/workflows/v78-route-parentheses.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v78-route-parentheses

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v78_patch.py
          python3 /tmp/v78_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v78: remove route spaces inside parentheses"
          git push
