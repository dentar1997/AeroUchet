name: Apply v73 source patch

on:
  push:
    branches:
      - ui/v73-smoother-downward-swipe
    paths:
      - .github/workflows/v73-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v73-smoother-downward-swipe

      - name: Patch version 73
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit v73
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v73: smooth downward duty swipe on ProMotion"
          git push
