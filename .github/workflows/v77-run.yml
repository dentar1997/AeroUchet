name: Apply v77 patch

on:
  push:
    branches:
      - ui/v77-remove-readonly-uikit-fields
    paths:
      - .github/workflows/v77-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v77-remove-readonly-uikit-fields

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v77_patch.py
          python3 /tmp/v77_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v77: remove read-only UIKit fields from duty card"
          git push
