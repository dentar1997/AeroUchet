name: Apply PR57 UI fixes

on:
  push:
    branches:
      - ui/pr57-stable-card-sizing-time-overlay

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr57-stable-card-sizing-time-overlay
          fetch-depth: 0

      - name: Patch AppViews
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('AppViews.swift')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''            content()
                .font(.subheadline.weight(.semibold))
                .foregroundStyle(.primary)
                .lineLimit(1)
                .minimumScaleFactor(0.7)
                .frame(height: 22, alignment: .center)
''',
              '''            content()
                .font(.system(size: 15, weight: .semibold))
                .foregroundStyle(.primary)
                .lineLimit(1)
                .minimumScaleFactor(0.7)
                .frame(height: 18, alignment: .center)
''',
              'identity value size'
          )

          old_inline = '''                .frame(maxWidth: .infinity, minHeight: 22, maxHeight: 22)'''
          if text.count(old_inline) != 2:
              raise SystemExit(f'inline field size: expected 2 matches, found {text.count(old_inline)}')
          text = text.replace(old_inline, '''                .frame(maxWidth: .infinity, minHeight: 18, maxHeight: 18)''')

          replace_once(
              '''                    .frame(width: 58, height: 22)
''',
              '''                    .frame(width: 58, height: 18)
''',
              'registration field height'
          )

          replace_once(
              '''            Text(value)
                .font(.subheadline.weight(.semibold))
                .foregroundStyle(.primary)
                .minimumScaleFactor(0.85)
''',
              '''            Text(value)
                .font(.system(size: 15, weight: .semibold))
                .foregroundStyle(.primary)
                .minimumScaleFactor(0.85)
                .frame(height: 18, alignment: .leading)
''',
              'time card value size'
          )

          replace_once(
              '''        field.font = font
        field.adjustsFontForContentSizeCategory = true
''',
              '''        field.font = font
        field.adjustsFontForContentSizeCategory = false
''',
              'disable dynamic inline font resize'
          )

          replace_once(
              '''        context.coordinator.maxLength = maxLength

        if field.text != text && !field.isFirstResponder {
''',
              '''        context.coordinator.maxLength = maxLength
        field.font = font

        if field.text != text && !field.isFirstResponder {
''',
              'keep inline font stable'
          )

          replace_once(
              '''        .overlay(
            RoundedRectangle(cornerRadius: 20)
                .stroke(Color.accentColor.opacity(0.18), lineWidth: 1)
        )
        .clipShape(RoundedRectangle(cornerRadius: 20))
''',
              '''        .overlay(
            RoundedRectangle(cornerRadius: 20)
                .stroke(Color.accentColor.opacity(0.18), lineWidth: 1)
        )
        .overlay(alignment: .top) {
            activeTimeEditor
                .zIndex(10_000)
        }
        .clipShape(RoundedRectangle(cornerRadius: 20))
''',
              'root time editor overlay'
          )

          replace_once(
              '''    private func timeEditorVerticalOffset(for point: DutyEditPoint) -> CGFloat {
        switch point {
        case .workStart, .engineOn, .takeoff:
            return -205
        case .workEnd, .engineOff, .landing:
            return -226
        }
    }

''',
              '',
              'remove cell-relative time offset'
          )

          replace_once(
              '''    private func timeEditorZIndex(_ index: Int, _ point: DutyEditPoint) -> Double {
        focusedField == .time(index, point) ? 4000 : 0
    }

''',
              '',
              'remove time cell z index helper'
          )

          for point in ['workStart', 'engineOn', 'takeoff', 'workEnd', 'engineOff', 'landing']:
              line = f'                .zIndex(timeEditorZIndex(index, .{point}))\n'
              if text.count(line) != 1:
                  raise SystemExit(f'z-index line expected once: {point}')
              text = text.replace(line, '', 1)

          start = text.index('    private func timeCell(\n')
          end = text.index('    private func legValueCard(\n', start)
          old_block = text[start:end]
          new_block = '''    private func timeCell(
        title: String,
        value: String,
        index: Int,
        point: DutyEditPoint?
    ) -> some View {
        Group {
            if isEditing, let point {
                Button {
                    focusedField = .time(index, point)
                } label: {
                    legValueCard(title: title, value: formatDateTime(
                        point.date(in: times(for: draft[index]))
                    ))
                    .overlay(
                        RoundedRectangle(cornerRadius: 10)
                            .stroke(Color.accentColor.opacity(0.65), lineWidth: 1)
                    )
                }
                .buttonStyle(.plain)
            } else {
                legValueCard(title: title, value: value)
            }
        }
    }

    @ViewBuilder
    private var activeTimeEditor: some View {
        if case let .time(index, point) = focusedField,
           draft.indices.contains(index) {
            floatingEditor(width: 380, height: 282) {
                VStack(alignment: .leading, spacing: 6) {
                    editPopoverHeader(point.title, extraHorizontalInset: 0)

                    HStack(alignment: .top, spacing: 12) {
                        ZStack(alignment: .topLeading) {
                            DatePicker(
                                "",
                                selection: timeBinding(index, point),
                                displayedComponents: [.date]
                            )
                            .labelsHidden()
                            .datePickerStyle(.graphical)
                            .frame(width: 302, height: 330, alignment: .topLeading)
                            .transaction { transaction in
                                transaction.animation = nil
                            }
                            .animation(
                                nil,
                                value: point.date(in: times(for: draft[index]))
                            )
                            .scaleEffect(0.68, anchor: .topLeading)
                        }
                        .frame(width: 206, height: 225, alignment: .topLeading)
                        .clipped()
                        .contentShape(Rectangle())

                        DatePicker(
                            "",
                            selection: timeBinding(index, point),
                            displayedComponents: [.hourAndMinute]
                        )
                        .labelsHidden()
                        .datePickerStyle(.wheel)
                        .frame(width: 130, height: 288)
                        .scaleEffect(0.78, anchor: .topLeading)
                        .frame(width: 102, height: 225, alignment: .topLeading)
                        .clipped()
                        .contentShape(Rectangle())
                    }
                    .frame(maxWidth: .infinity, alignment: .center)
                }
            }
            .frame(maxWidth: .infinity, alignment: timeEditorAlignment(for: point))
            .padding(.horizontal, 18)
            .padding(.top, 52)
        }
    }

'''
          text = text[:start] + new_block + text[end:]

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/pr57-ui-fix.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift .github/workflows/pr57-ui-fix.yml
          git commit -m "[PR #57] Stabilize edit card sizing and time editor layering"
          git push origin HEAD:ui/pr57-stable-card-sizing-time-overlay
