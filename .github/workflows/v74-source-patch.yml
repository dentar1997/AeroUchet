name: Apply v74 source patch

on:
  push:
    branches:
      - ui/v74-rasterized-duty-swipe
    paths:
      - .github/workflows/v74-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v74-rasterized-duty-swipe

      - name: Patch version 74
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('AppViews.swift')
          text = path.read_text()

          old = '''                .frame(\n                    maxWidth: .infinity,\n                    maxHeight: .infinity,\n                    alignment: .center\n                )\n                .offset(y: dragOffset)\n'''
          new = '''                .frame(\n                    maxWidth: .infinity,\n                    maxHeight: .infinity,\n                    alignment: .center\n                )\n                // Flatten the complete duty card into one render surface before\n                // applying the interactive transform. This keeps 2–3 leg cards\n                // from repainting every row on each ProMotion gesture update.\n                .drawingGroup(opaque: false, colorMode: .nonLinear)\n                .offset(y: dragOffset)\n'''
          if old not in text:
              raise SystemExit('overlay frame block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          version = Path('AppVersion.swift')
          value = version.read_text().replace('static let number = 73', 'static let number = 74').replace('static let label = "Версия 73"', 'static let label = "Версия 74"')
          version.write_text(value)

          package = Path('Package.swift')
          value = package.read_text().replace('displayVersion: "73"', 'displayVersion: "74"').replace('bundleVersion: "73"', 'bundleVersion: "74"')
          package.write_text(value)

          Path('.github/workflows/v74-source-patch.yml').unlink()
          PY

      - name: Commit v74
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v74: flatten duty card rendering during swipe"
          git push
