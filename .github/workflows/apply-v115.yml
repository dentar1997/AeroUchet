name: Apply version 115 patch

on:
  push:
    branches:
      - feature/duty-editor-v115
    paths:
      - scripts/apply_v115.py
      - .github/workflows/apply-v115.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/duty-editor-v115

      - name: Apply patch
        run: python3 scripts/apply_v115.py

      - name: Validate patch
        run: git diff --check

      - name: Commit result and remove temporary files
        run: |
          rm -f scripts/apply_v115.py .github/workflows/apply-v115.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Версия 115: поиск, ручное задание и возврат расчётного времени"
          git push origin feature/duty-editor-v115
