name: Apply v87 compact duty card

on:
  push:
    branches:
      - ui/v87-compact-duty-card
    paths:
      - .github/workflows/v87-compact-card.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v87-compact-duty-card

      - name: Apply compact card patch
        run: python3 .github/scripts/v87_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v87: compact duty card width"
          git push origin ui/v87-compact-duty-card
