name: AeroUchet Warm iPad
run-name: "Warm iPad · ${{ inputs.mode || 'serve' }} · ${{ github.ref_name }}"

# Тёплый iPad на всю задачу (DECISIONS U53, .memory/WORKFLOW.md).
# Запускать В НАЧАЛЕ работы над UI-задачей, а не при открытии PR:
#   Claude:  gh workflow run early-ipad-prewarm.yml -f request_epoch=$(date +%s)
#   ChatGPT: изменить .github/prewarm/request.json в ветке prewarm/<тема> и сделать push
# Сессия загружает iPad Pro 12,9″ (тёмная тема, альбомная), собирает main и даёт
# системе «осесть». Затем КАЖДЫЙ новый SHA открытых PR из веток prewarm/* она сама
# собирает инкрементально (тёплый DerivedData) и снимает без повторной загрузки;
# если своя сборка не удалась не из-за кода — берёт .app из PR CI.
# Снимки: ветка ci-shots (видна через git) и артефакт ipad-shot в PR CI.
# Повторный запрос во время сессии поглощается ею; mode=restart — перезапуск
# (например, после изменения скриптов), mode=stop — остановить.

on:
  push:
    branches:
      - 'prewarm/**'
    paths:
      - '.github/prewarm/request.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'serve — тёплый iPad; restart — перезапустить сессию; stop — остановить'
        required: false
        default: 'serve'
        type: choice
        options:
          - serve
          - restart
          - stop
      idle_minutes:
        description: 'Сколько минут ждать новую правку после последнего снимка'
        required: false
        default: '120'
      wait_first_minutes:
        description: 'Сколько минут ждать первый PR'
        required: false
        default: '120'
      request_epoch:
        description: 'Unix-время запроса (для замеров), можно оставить пустым'
        required: false
        default: ''

permissions:
  contents: write       # публикация снимков в ветку ci-shots
  actions: write        # поглощение повторных запросов (отмена дублей)
  pull-requests: read

# Одна сессия на репозиторий: новый запрос ждёт, а работающая сессия его поглощает.
concurrency:
  group: warm-ipad
  cancel-in-progress: false

jobs:
  warm-ipad:
    name: Warm iPad session (prewarm/* PRs)
    if: ${{ inputs.mode != 'stop' }}
    runs-on: macos-26
    timeout-minutes: 350   # предел GitHub — 360; сессия сама завершается на 330
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Warm the iPad and serve every new PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IDLE_MINUTES: ${{ inputs.idle_minutes || '120' }}
          WAIT_FIRST_MINUTES: ${{ inputs.wait_first_minutes || '120' }}
          REQUEST_EPOCH: ${{ inputs.request_epoch }}
        run: |
          python3 Scripts/ci_ipad.py session \
            --root "$RUNNER_TEMP/warm-ipad" \
            --idle-minutes "$IDLE_MINUTES" \
            --wait-first-minutes "$WAIT_FIRST_MINUTES" \
            --request-epoch "$REQUEST_EPOCH"

      - name: Upload session diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warm-ipad-session
          path: |
            ${{ runner.temp }}/warm-ipad/
            !${{ runner.temp }}/warm-ipad/**/*.zip
          if-no-files-found: warn
          retention-days: 7
