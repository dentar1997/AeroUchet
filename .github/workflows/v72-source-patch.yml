name: Apply v72 source patch

on:
  push:
    branches:
      - ui/v72-route-spacing-smooth-swipe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v72
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_views = Path("AppViews.swift")
          text = app_views.read_text()

          start_marker = "    private func dismissDrag(in height: CGFloat, enabled: Bool) -> some Gesture {"
          end_marker = "\n}\n\n\n// MARK: - Строка смены"
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          new_drag = '''    private func dismissDrag(in height: CGFloat, enabled: Bool) -> some Gesture {
              DragGesture(minimumDistance: 3)
                  .onChanged { value in
                      guard enabled else {
                          dragOffset = 0
                          return
                      }

                      // Вниз карточка идёт за пальцем без задержки.
                      // Вверх используется плавная нелинейная резинка без жёсткого упора.
                      if value.translation.height >= 0 {
                          dragOffset = value.translation.height
                      } else {
                          dragOffset = upwardRubberBand(value.translation.height)
                      }
                  }
                  .onEnded { value in
                      guard enabled else {
                          dragOffset = 0
                          return
                      }

                      let predicted = max(
                          value.translation.height,
                          value.predictedEndTranslation.height
                      )
                      let shouldClose =
                          value.translation.height > 110
                          || predicted > 220

                      if shouldClose {
                          withAnimation(
                              .spring(response: 0.34, dampingFraction: 0.92)
                          ) {
                              dragOffset = max(height + 80, 580)
                          }

                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.30) {
                              onClose()
                          }
                      } else {
                          withAnimation(
                              .spring(response: 0.42, dampingFraction: 0.88)
                          ) {
                              dragOffset = 0
                          }
                      }
                  }
          }

          private func upwardRubberBand(_ translation: CGFloat) -> CGFloat {
              let distance = abs(min(translation, 0))
              let maxLift: CGFloat = 36
              let softness: CGFloat = 90
              return -maxLift * distance / (distance + softness)
          }
          '''

          text = text[:start] + new_drag + text[end:]

          old_arrow = '''            Text(" → ")
                          .foregroundStyle(.secondary)
          '''
          new_arrow = '''            Text("→")
                          .foregroundStyle(.secondary)
                          .padding(.horizontal, 5)
          '''
          if text.count(old_arrow) != 1:
              raise RuntimeError(f"arrow block count: {text.count(old_arrow)}")
          text = text.replace(old_arrow, new_arrow)

          old_editor = '''            stableInlineEditor(
                          text: code,
                          isActive: routeFocusBinding(index: index, side: side),
                          keyboardType: .asciiCapable,
                          capitalization: .allCharacters,
                          maxLength: 5,
                          expands: false,
                          allowsEditing: isEditing,
                          highlightHorizontalPadding: 0
                      )
          '''
          new_editor = '''            stableInlineEditor(
                          text: code,
                          isActive: routeFocusBinding(index: index, side: side),
                          keyboardType: .asciiCapable,
                          capitalization: .allCharacters,
                          maxLength: 5,
                          expands: false,
                          allowsEditing: isEditing,
                          highlightHorizontalPadding: 0
                      )
                      .frame(width: routeCodeWidth(code.wrappedValue))
          '''
          if text.count(old_editor) != 1:
              raise RuntimeError(f"route editor block count: {text.count(old_editor)}")
          text = text.replace(old_editor, new_editor)

          route_binding_marker = "    private func routeCodeBinding(index: Int, side: RouteEditSide) -> Binding<String> {"
          if text.count(route_binding_marker) != 1:
              raise RuntimeError("route binding marker not unique")
          width_helper = '''    private func routeCodeWidth(_ code: String) -> CGFloat {
              let font = UIFont.systemFont(ofSize: 15, weight: .semibold)
              let width = (code as NSString).size(withAttributes: [.font: font]).width
              return max(1, ceil(width))
          }

          '''
          text = text.replace(route_binding_marker, width_helper + route_binding_marker)
          app_views.write_text(text)

          version = Path("AppVersion.swift")
          value = version.read_text()
          value = value.replace("static let number = 71", "static let number = 72")
          value = value.replace('static let label = "Версия 71"', 'static let label = "Версия 72"')
          version.write_text(value)

          package = Path("Package.swift")
          value = package.read_text()
          value = value.replace('displayVersion: "71"', 'displayVersion: "72"')
          value = value.replace('bundleVersion: "71"', 'bundleVersion: "72"')
          package.write_text(value)

          Path(".github/workflows/v72-source-patch.yml").unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v72: route spacing and smoother duty swipe"
          git push
