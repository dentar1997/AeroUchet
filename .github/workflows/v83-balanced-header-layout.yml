name: Apply v83 balanced header layout

on:
  push:
    branches:
      - ui/v83-balanced-header-layout
    paths:
      - .github/workflows/v83-balanced-header-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v83-balanced-header-layout

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v83_patch.py
          python3 /tmp/v83_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v83: balance header cards and center route"
          git push origin ui/v83-balanced-header-layout
