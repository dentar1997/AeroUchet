name: Apply v84 layout

on:
  push:
    branches:
      - ui/v84-fill-header-columns
    paths:
      - .github/workflows/v84-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v84-fill-header-columns

      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/v84_patch.py
          python3 /tmp/v84_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v84: fill header columns evenly"
          git push origin ui/v84-fill-header-columns
