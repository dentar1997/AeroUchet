name: Apply PR54 interaction fixes

on:
  push:
    branches:
      - ui/pr54-editor-interaction-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr54-editor-interaction-fixes
          fetch-depth: 0

      - name: Apply source patch
        run: python3 pr54_patch.py

      - name: Remove temporary patch files
        run: rm -f pr54_patch.py .github/workflows/pr54-apply.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR54 patched] Fix editor interaction and layering"
          git push
