name: Apply v90 visual tuning

on:
  push:
    branches:
      - ui/v90-visual-tuning
    paths:
      - .github/workflows/v90-visual-tuning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v90-visual-tuning

      - name: Apply v90 patch
        run: python3 .github/scripts/v90_visual_tuning.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v90: align leg layout and simplify totals"
          git push origin ui/v90-visual-tuning
