name: Apply v85 two-row leg header

on:
  push:
    branches:
      - ui/v85-two-row-leg-header
    paths:
      - .github/workflows/v85-two-row-leg-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v85-two-row-leg-header

      - name: Apply visual patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('AppViews.swift')
          s = p.read_text()

          replacement = '''    private func legHeader(_ leg: FlightLeg, index: Int) -> some View {
        VStack(spacing: 6) {
            HStack(alignment: .top, spacing: 8) {
                flightNumber(leg, index: index)
                    .frame(maxWidth: .infinity)
                aircraftField(leg, index: index)
                    .frame(maxWidth: .infinity)
                registrationField(leg, index: index)
                    .frame(maxWidth: .infinity)
                flightKindField(leg, index: index)
                    .frame(maxWidth: .infinity)
                calculatedTime(leg, index: index)
                    .frame(maxWidth: .infinity)
            }
            .frame(maxWidth: .infinity)

            routeField(leg, index: index)
                .frame(maxWidth: .infinity)
        }
    }

    private func flightNumber'''

          s, count = re.subn(
              r"    private func legHeader\(_ leg: FlightLeg, index: Int\) -> some View \{.*?\n    \}\n\n    private func flightNumber",
              replacement,
              s,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'legHeader not found'

          p.write_text(s)

          p = Path('AppVersion.swift')
          s = p.read_text()
          assert 'static let number = 84' in s and 'static let label = "Версия 84"' in s
          s = s.replace('static let number = 84', 'static let number = 85')
          s = s.replace('static let label = "Версия 84"', 'static let label = "Версия 85"')
          p.write_text(s)

          p = Path('Package.swift')
          s = p.read_text()
          assert 'displayVersion: "84"' in s and 'bundleVersion: "84"' in s
          s = s.replace('displayVersion: "84"', 'displayVersion: "85"')
          s = s.replace('bundleVersion: "84"', 'bundleVersion: "85"')
          p.write_text(s)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v85: move route to second header row"
          git push origin ui/v85-two-row-leg-header
