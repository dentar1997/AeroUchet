name: Fix PR55 build

on:
  push:
    branches:
      - ui/pr55-inline-card-editing

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr55-inline-card-editing
          fetch-depth: 0

      - name: Fix SwiftUI frame call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AppViews.swift')
          s = path.read_text()
          old = '.frame(width: 166, minHeight: 38, alignment: .leading)'
          new = '.frame(width: 166, height: 38, alignment: .leading)'
          if old not in s:
              raise SystemExit('target frame call not found')
          path.write_text(s.replace(old, new, 1))
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/pr55-fix-build.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR55 fix] Correct calculated-time editor frame"
          git push origin HEAD:ui/pr55-inline-card-editing
