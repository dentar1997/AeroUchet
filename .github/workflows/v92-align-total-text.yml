name: Apply v92 total alignment

on:
  push:
    branches:
      - ui/v92-align-total-text
    paths:
      - .github/workflows/v92-align-total-text.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v92-align-total-text

      - name: Apply v92 patch
        run: python3 .github/scripts/v92_align_total_text.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v92: align duty totals with leg grid"
          git push origin ui/v92-align-total-text
