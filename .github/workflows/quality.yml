name: AeroUchet Quality
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr59-normalize-edit-card-fonts
          fetch-depth: 0
      - name: Normalize card fonts
        run: |
          sed -i 's/\.font(\.system(size: 15, weight: \.semibold))/\.font(\.subheadline.weight(\.semibold))/g' AppViews.swift
          COUNT=$(grep -c '\.font(\.subheadline.weight(\.semibold))' AppViews.swift)
          test "$COUNT" -ge 2
      - name: Restore workflow
        run: git checkout origin/main -- .github/workflows/quality.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift .github/workflows/quality.yml
          git commit -m "[PR #59] Match editable card typography to normal cards"
          git push origin HEAD:ui/pr59-normalize-edit-card-fonts
