name: AeroUchet Quality

on:
  push:
    branches:
      - ui/pr60-editor-position-and-font-stability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr60-editor-position-and-font-stability
          fetch-depth: 0
      - name: Apply patch
        run: python3 pr60_patch.py
      - name: Restore workflow and remove patch script
        run: |
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm pr60_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[PR #60] Stabilize inline editing and position time editor by leg"
          git push origin HEAD:ui/pr60-editor-position-and-font-stability
