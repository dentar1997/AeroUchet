name: AeroUchet Quality
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr60-focus-font-time-editor-position
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/pr60_patch.py
      - name: Cleanup temporary files
        run: |
          rm .github/pr60_patch.py
          git checkout origin/main -- .github/workflows/quality.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift .github/pr60_patch.py .github/workflows/quality.yml
          git commit -m "[PR #60] Stabilize inline editing and time editor placement"
          git push origin HEAD:ui/pr60-focus-font-time-editor-position
