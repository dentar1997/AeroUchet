name: PR61 Apply patch

on:
  push:
    branches:
      - ui/pr61-time-editor-overlay-and-font

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr61-time-editor-overlay-and-font
          fetch-depth: 0

      - name: Apply patch
        run: |
          python3 .github/pr61_fix_patch.py
          python3 .github/pr61_patch.py

      - name: Restore workflow and remove patch scripts
        run: |
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm .github/pr61_patch.py .github/pr61_fix_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift .github/workflows/quality.yml .github/pr61_patch.py .github/pr61_fix_patch.py
          git commit -m "[PR #61] Fix time editor overlay dismissal and font stability"
          git push origin HEAD:ui/pr61-time-editor-overlay-and-font
