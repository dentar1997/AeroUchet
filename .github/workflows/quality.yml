name: PR62 Apply patch

on:
  push:
    branches:
      - ui/pr62-stable-inline-font

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/pr62-stable-inline-font
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/pr62_patch.py

      - name: Restore workflow and remove patch script
        run: |
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm .github/pr62_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift .github/workflows/quality.yml .github/pr62_patch.py
          git commit -m "[PR #62] Keep inline edit text visually identical to card text"
          git push origin HEAD:ui/pr62-stable-inline-font
