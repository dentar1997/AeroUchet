name: Apply v86 compact header

on:
  push:
    branches:
      - ui/v86-compact-leg-header
    paths:
      - .github/workflows/v86-compact-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v86-compact-leg-header

      - name: Apply compact layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AppViews.swift')
          s = p.read_text()

          old = '''            HStack(alignment: .top, spacing: 8) {
                flightNumber(leg, index: index)
                    .frame(maxWidth: .infinity)
                aircraftField(leg, index: index)
                    .frame(maxWidth: .infinity)
                registrationField(leg, index: index)
                    .frame(maxWidth: .infinity)
                flightKindField(leg, index: index)
                    .frame(maxWidth: .infinity)
                calculatedTime(leg, index: index)
                    .frame(maxWidth: .infinity)
            }
            .frame(maxWidth: .infinity)'''
          new = '''            HStack(alignment: .top, spacing: 8) {
                flightNumber(leg, index: index)
                aircraftField(leg, index: index)
                registrationField(leg, index: index)
                flightKindField(leg, index: index)
                calculatedTime(leg, index: index)
            }
            .frame(maxWidth: .infinity, alignment: .center)'''
          assert old in s, 'expanded five-cell header not found'
          s = s.replace(old, new, 1)

          old = '''        .padding(.horizontal, 10)
        .frame(maxWidth: .infinity, alignment: .center)
        .padding(.vertical, 6)'''
          new = '''        .padding(.horizontal, 10)
        .padding(.vertical, 6)
        .fixedSize(horizontal: true, vertical: false)'''
          assert old in s, 'identityField expanding frame not found'
          s = s.replace(old, new, 1)

          count = s.count('''                            centered: true,
                            compact: false''')
          assert count >= 1, 'editing calculatedTime compact flag not found'
          s = s.replace('''                            centered: true,
                            compact: false''', '''                            centered: true,
                            compact: true''', 1)

          assert '''                    centered: true,
                    compact: false''' in s, 'static calculatedTime compact flag not found'
          s = s.replace('''                    centered: true,
                    compact: false''', '''                    centered: true,
                    compact: true''', 1)

          p.write_text(s)

          p = Path('AppVersion.swift')
          s = p.read_text()
          assert 'static let number = 85' in s and 'static let label = "Версия 85"' in s
          s = s.replace('static let number = 85', 'static let number = 86')
          s = s.replace('static let label = "Версия 85"', 'static let label = "Версия 86"')
          p.write_text(s)

          p = Path('Package.swift')
          s = p.read_text()
          assert 'displayVersion: "85"' in s and 'bundleVersion: "85"' in s
          s = s.replace('displayVersion: "85"', 'displayVersion: "86"')
          s = s.replace('bundleVersion: "85"', 'bundleVersion: "86"')
          p.write_text(s)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v86: compact leg header cells"
          git push origin ui/v86-compact-leg-header
