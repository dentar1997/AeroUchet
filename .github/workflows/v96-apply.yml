name: Apply v96 UI edits

on:
  push:
    branches: ["ui/v96-edit-guard-layout"]
    paths:
      - ".github/workflows/v96-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v96-edit-guard-layout
      - name: Apply patch
        run: python3 .github/scripts/v96_patch.py
      - name: Commit app changes
        run: |
          rm .github/workflows/v96-apply.yml
          rm .github/scripts/v96_patch.py
          git config user.name "dentar1997"
          git config user.email "dentar1997@gmail.com"
          git add AppViews.swift .github/workflows/v96-apply.yml .github/scripts/v96_patch.py
          git commit -m "v96: protect edit mode and refine assignment header"
          git push origin ui/v96-edit-guard-layout
