name: Format v85 header

on:
  push:
    branches:
      - ui/v85-two-row-leg-header
    paths:
      - .github/workflows/v85-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v85-two-row-leg-header

      - name: Fix formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AppViews.swift')
          s = p.read_text()
          old = '''    private func legHeader(_ leg: FlightLeg, index: Int) -> some View {
    VStack(spacing: 6) {
        HStack(alignment: .top, spacing: 8) {
            flightNumber(leg, index: index)
                .frame(maxWidth: .infinity)
            aircraftField(leg, index: index)
                .frame(maxWidth: .infinity)
            registrationField(leg, index: index)
                .frame(maxWidth: .infinity)
            flightKindField(leg, index: index)
                .frame(maxWidth: .infinity)
            calculatedTime(leg, index: index)
                .frame(maxWidth: .infinity)
        }
        .frame(maxWidth: .infinity)

        routeField(leg, index: index)
            .frame(maxWidth: .infinity)
    }
}

private func flightNumber'''
          new = '''    private func legHeader(_ leg: FlightLeg, index: Int) -> some View {
        VStack(spacing: 6) {
            HStack(alignment: .top, spacing: 8) {
                flightNumber(leg, index: index)
                    .frame(maxWidth: .infinity)
                aircraftField(leg, index: index)
                    .frame(maxWidth: .infinity)
                registrationField(leg, index: index)
                    .frame(maxWidth: .infinity)
                flightKindField(leg, index: index)
                    .frame(maxWidth: .infinity)
                calculatedTime(leg, index: index)
                    .frame(maxWidth: .infinity)
            }
            .frame(maxWidth: .infinity)

            routeField(leg, index: index)
                .frame(maxWidth: .infinity)
        }
    }

    private func flightNumber'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift
          git commit -m "chore: normalize v85 header formatting"
          git push origin ui/v85-two-row-leg-header
