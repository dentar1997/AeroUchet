name: Format v83 header block

on:
  push:
    branches:
      - ui/v83-balanced-header-layout
    paths:
      - .github/workflows/v83-format-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v83-balanced-header-layout

      - name: Fix header indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("AppViews.swift")
          s = p.read_text()
          block = '''    private func legHeader(_ leg: FlightLeg, index: Int) -> some View {
              LazyVGrid(columns: timeColumns, alignment: .leading, spacing: 8) {
                  Group {
                      if sizeClass == .compact {
                          VStack(spacing: 4) {
                              flightNumber(leg, index: index)
                              aircraftField(leg, index: index)
                              registrationField(leg, index: index)
                          }
                      } else {
                          HStack(alignment: .top, spacing: 8) {
                              flightNumber(leg, index: index)
                              aircraftField(leg, index: index)
                              registrationField(leg, index: index)
                          }
                          .frame(maxWidth: .infinity, alignment: .center)
                      }
                  }
                  .frame(maxWidth: .infinity, alignment: .top)

                  routeField(leg, index: index)
                      .frame(maxWidth: .infinity, alignment: .top)

                  Group {
                      if sizeClass == .compact {
                          VStack(spacing: 4) {
                              flightKindField(leg, index: index)
                              calculatedTime(leg, index: index)
                          }
                      } else {
                          HStack(alignment: .top, spacing: 8) {
                              flightKindField(leg, index: index)
                              calculatedTime(leg, index: index)
                          }
                          .frame(maxWidth: .infinity, alignment: .center)
                      }
                  }
                  .frame(maxWidth: .infinity, alignment: .top)
              }
          }

          private func flightNumber'''
          s, n = re.subn(
              r"    private func legHeader\(_ leg: FlightLeg, index: Int\) -> some View \{.*?\n\}\n\nprivate func flightNumber",
              block,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1
          p.write_text(s)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift
          git commit -m "chore: normalize v83 header formatting"
          git push origin ui/v83-balanced-header-layout
