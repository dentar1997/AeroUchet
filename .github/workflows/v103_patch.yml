name: v103 inline wheel patch

on:
  push:
    branches:
      - ui/v103-refined-inline-wheel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v103-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v103-refined-inline-wheel
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/v103_patch.py
      - name: Remove temporary patch files
        run: |
          rm -f .github/v103_patch.py
          rm -f .github/workflows/v103_patch.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Доработать тест 3 inline-крутилки [v103-patched]"
          git push origin HEAD:ui/v103-refined-inline-wheel
