name: Apply v91 aligned layout

on:
  push:
    branches:
      - ui/v91-align-totals-and-header-row
    paths:
      - .github/workflows/v91-align-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v91-align-totals-and-header-row

      - name: Apply v91 patch
        run: python3 .github/scripts/v91_align_layout.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v91: align totals and compact identity row"
          git push origin ui/v91-align-totals-and-header-row
