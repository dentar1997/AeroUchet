name: Apply v93 editable value colors

on:
  push:
    branches:
      - ui/v93-editable-values-accent
    paths:
      - .github/workflows/v93-edit-colors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v93-editable-values-accent

      - name: Apply v93 patch
        run: python3 .github/scripts/v93_edit_colors.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift AppVersion.swift Package.swift
          git commit -m "v93: show editable values with accent color"
          git push origin ui/v93-editable-values-accent
