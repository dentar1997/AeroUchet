name: v104 full Test 3 patch
on:
  push:
    branches:
      - ui/v104-full-test3-editor
    paths:
      - .github/v104_patch.py
      - .github/workflows/v104_patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v104-full-test3-editor
      - name: Apply patch
        run: python3 .github/v104_patch.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add InlineWheelTestView.swift
          git commit -m "Полный интерактивный Test 3 [v104-patched]" || exit 0
          git push
