name: v104 full test3 patch

on:
  push:
    branches:
      - ui/v104-full-test3-editor
    paths:
      - .github/workflows/v104_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v104-full-test3-editor

      - name: Apply v104 wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          view = Path('InlineWheelTestView.swift')
          text = view.read_text()
          old = 'FixedGeometryAssignmentCard(isEditing: isEditing)'
          new = 'FullEditorTest3View(isEditing: isEditing)'
          if old not in text:
              raise SystemExit('Test 3 call not found')
          view.write_text(text.replace(old, new, 1))

          version = Path('AppVersion.swift')
          v = version.read_text()
          v = v.replace('static let number = 103', 'static let number = 104')
          v = v.replace('static let label = "Версия 103"', 'static let label = "Версия 104"')
          version.write_text(v)

          package = Path('Package.swift')
          p = package.read_text()
          p = p.replace('displayVersion: "103"', 'displayVersion: "104"')
          p = p.replace('bundleVersion: "103"', 'bundleVersion: "104"')
          package.write_text(p)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v104_patch.yml
          git add InlineWheelTestView.swift AppVersion.swift Package.swift FullEditorTest3View.swift
          git commit -m "Подключить полный интерактивный Тест 3 [v104]"
          git push
