name: v104 final Test 3 copy
on:
  push:
    branches:
      - fix/v104-final-test3
    paths:
      - .github/workflows/v104_finalize.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v104-final-test3
          fetch-depth: 0
      - name: Copy final Test 3 files
        run: |
          git fetch origin ui/v104-full-test3-editor
          git show origin/ui/v104-full-test3-editor:FullEditorTest3View.swift > FullEditorTest3View.swift
          git show origin/ui/v104-full-test3-editor:InlineWheelTestView.swift > InlineWheelTestView.swift
      - name: Commit final files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FullEditorTest3View.swift InlineWheelTestView.swift
          git commit -m "Перенести финальный Test 3 v104" || exit 0
          git push
