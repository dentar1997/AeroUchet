name: v131 patch

on:
  push:
    branches:
      - chatgpt/v131-schedule-browser

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'v131: apply patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v131-schedule-browser
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/v131_patch.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ReferenceDataV129.swift PerspectiveDutyBridgeV129.swift AppViews.swift PlanAssignmentRowV119.swift
          git diff --cached --quiet && exit 0
          git commit -m 'v131: apply patch'
          git push
