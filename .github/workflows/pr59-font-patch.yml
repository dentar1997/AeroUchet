name: PR59 font patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr59-normalize-edit-card-fonts
          fetch-depth: 0

      - name: Patch AppViews
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('AppViews.swift')
          text = path.read_text()

          old = '''            content()
                .font(.system(size: 15, weight: .semibold))
                .foregroundStyle(.primary)
                .lineLimit(1)
                .minimumScaleFactor(0.7)
                .frame(height: 18, alignment: .center)
'''
          new = '''            content()
                .font(.subheadline.weight(.semibold))
                .foregroundStyle(.primary)
                .lineLimit(1)
                .minimumScaleFactor(0.7)
                .frame(height: 18, alignment: .center)
'''
          if text.count(old) != 1:
              raise SystemExit(f'identity font match count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            Text(value)
                .font(.system(size: 15, weight: .semibold))
                .foregroundStyle(.primary)
                .minimumScaleFactor(0.85)
                .frame(height: 18, alignment: .leading)
'''
          new = '''            Text(value)
                .font(.subheadline.weight(.semibold))
                .foregroundStyle(.primary)
                .minimumScaleFactor(0.85)
                .frame(height: 18, alignment: .leading)
'''
          if text.count(old) != 1:
              raise SystemExit(f'value font match count: {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/pr59-font-patch.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift .github/workflows/pr59-font-patch.yml
          git commit -m "[PR #59] Match editable card fonts to normal value cards"
          git push origin HEAD:ui/pr59-normalize-edit-card-fonts
