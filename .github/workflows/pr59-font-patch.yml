name: PR59 font patch

on:
  push:
    branches:
      - ui/pr59-normalize-edit-card-fonts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/pr59-normalize-edit-card-fonts
          fetch-depth: 0

      - name: Normalize card typography
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('AppViews.swift')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''            content()
                .font(.system(size: 15, weight: .semibold))
                .foregroundStyle(.primary)
                .lineLimit(1)
                .minimumScaleFactor(0.7)
                .frame(height: 18, alignment: .center)
''',
              '''            content()
                .font(.subheadline.weight(.semibold))
                .foregroundStyle(.primary)
                .lineLimit(1)
                .minimumScaleFactor(0.7)
                .frame(height: 18, alignment: .center)
''',
              'editable identity card font'
          )

          replace_once(
              '''            Text(value)
                .font(.system(size: 15, weight: .semibold))
                .foregroundStyle(.primary)
                .minimumScaleFactor(0.85)
                .frame(height: 18, alignment: .leading)
''',
              '''            Text(value)
                .font(.subheadline.weight(.semibold))
                .foregroundStyle(.primary)
                .minimumScaleFactor(0.85)
                .frame(height: 18, alignment: .leading)
''',
              'normal value card font'
          )

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/pr59-font-patch.yml

      - name: Commit typography fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppViews.swift .github/workflows/pr59-font-patch.yml
          git commit -m "[PR #59] Match editable card typography to value cards"
          git push origin HEAD:ui/pr59-normalize-edit-card-fonts
